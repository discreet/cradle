# Global tool versions. Pin exact versions per project with a mise.toml in the
# repo (`mise use kubectl@1.34`); these are only the defaults.
[env]
# Go's module cache and build cache live here instead of ~/go. Set in mise so
# it also applies to mise's own `go:` installs (gopls, goimports).
GOPATH = "{{env.HOME}}/.local/share/go"

[tools]
# Languages
go = "latest"
node = "lts" # several language servers below are npm packages
uv = "latest" # manages Python interpreters, venvs and tools

# Dotfiles
chezmoi = "latest"

# Editor & terminal multiplexer
neovim = "latest"
tmux = "latest"

# Search (fzf-lua in Neovim uses both)
ripgrep = "latest"
fzf = "latest"

# Lint
shellcheck = "latest"
shfmt = "latest"

# Language servers and formatters for Neovim (enabled in nvim/lua/plugins/lsp.lua)
"npm:basedpyright" = "latest"
"npm:bash-language-server" = "latest" # uses shellcheck and shfmt above
"npm:dockerfile-language-server-nodejs" = "latest" # Dockerfile completion/hover
"github:docker/docker-language-server" = "latest" # Compose; Dockerfile build checks need docker buildx
"go:golang.org/x/tools/gopls" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
helm-ls = "latest"
"npm:vscode-langservers-extracted" = "latest" # JSON
lua-language-server = "latest"
marksman = "latest"
ruff = "latest"
stylua = "latest"
terraform-ls = "latest"
tflint = "latest"
"npm:yaml-language-server" = "latest"

# Containers: Docker in a Colima VM (`colima start`). compose and buildx are
# registered as docker CLI plugins in ~/.docker/config.json.
colima = "latest"
lima = "latest" # colima runs its VM with lima
docker-cli = "latest"
docker-compose = "latest"
"github:docker/buildx" = { version = "latest", bin = "docker-buildx" }
"github:docker/docker-credential-helpers" = { version = "latest", bin = "docker-credential-osxkeychain", asset_pattern = "docker-credential-osxkeychain-*.darwin-arm64" }

# Cloud & Kubernetes
aws-cli = "latest"
kubectl = "latest"
helm = "latest"
k9s = "latest"
terraform = "latest"

# AI
claude-code = "latest"
