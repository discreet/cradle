# Built-in keys this config relies on (after the prefix):
#   windows   c new, n/p next/prev, 1-9 jump, w pick, , rename, & close
#   panes     z zoom, ; last pane, x close
#   sessions  s pick, ( ) prev/next, L last, $ rename, d detach
#   copy      [ copy mode (scroll/search with vi keys), ] paste

unbind-key C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# True colour in Ghostty; focus events let Neovim reload changed files.
set-option -as terminal-features ",xterm-ghostty:RGB"
set-option -g focus-events on
set-option -g history-limit 50000
set-option -g mouse on

# Number windows and panes from 1 like the keyboard, without gaps.
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
# Closing a session moves to another one instead of leaving tmux.
set-option -g detach-on-destroy off

set-option -g status-style "bg=black,fg=blue"
set-option -g status-left "[#S] "
set-option -g status-right "#{?client_prefix,#[reverse] PREFIX #[noreverse] ,}#[fg=yellow]%a %b %-d %-l:%M %p"
set-window-option -g window-status-current-style "fg=white"

# v selects (C-v for a block), y copies to the clipboard through Ghostty.
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# New windows and splits open in the current pane's directory. \ splits side
# by side (| without Shift), - splits top and bottom.
unbind-key '"'
unbind-key %
bind-key c new-window -c "#{pane_current_path}"
bind-key '\' split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# hjkl moves between panes, Ctrl-hjkl resizes (repeatable).
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r C-h resize-pane -L 5
bind-key -r C-j resize-pane -D 5
bind-key -r C-k resize-pane -U 5
bind-key -r C-l resize-pane -R 5
bind-key Tab last-window

bind-key S command-prompt -p "new session:" { new-session -s "%%" }
bind-key r { source-file ~/.config/tmux/tmux.conf; display-message "config reloaded" }
